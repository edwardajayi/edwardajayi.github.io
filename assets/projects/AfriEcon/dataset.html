<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriEcon Dataset Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dataset-styles.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">AfriEcon Dataset Viewer</h1>
                <p class="subtitle">Browse and Export ACL Dataset</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Status and Controls -->
            <div class="controls-section">
                <div class="status-card">
                    <div class="status-indicator">
                        <div class="pulse-dot"></div>
                        <span id="connectionStatus">Connecting to database...</span>
                    </div>
                    <div class="record-count">
                        <span id="recordCount">0</span> records loaded
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="loadDataBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
                        </svg>
                        Load Dataset
                    </button>
                    <button class="btn btn-secondary" id="exportCSVBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                        </svg>
                        Export CSV
                    </button>
                    <button class="btn btn-secondary" id="exportJSONBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                        </svg>
                        Export JSON
                    </button>
                    <button class="btn btn-secondary" id="viewResultsBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        View Results
                    </button>
                </div>
            </div>

            <!-- Search and Filter -->
            <section class="card">
                <h2 class="card-title">Search & Filter</h2>
                <div class="search-controls">
                    <div class="search-group">
                        <input type="text" id="searchInput" placeholder="Search across all fields..."
                            class="search-input">
                    </div>
                    <div class="filter-group">
                        <select id="questionTypeFilter" class="filter-select">
                            <option value="">All Question Types</option>
                        </select>
                        <select id="actionFilter" class="filter-select">
                            <option value="">All Actions</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Data Table -->
            <section class="card table-card">
                <div class="table-header">
                    <h2 class="card-title">Dataset Records</h2>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="table">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="7" height="7" />
                                <rect x="14" y="3" width="7" height="7" />
                                <rect x="14" y="14" width="7" height="7" />
                                <rect x="3" y="14" width="7" height="7" />
                            </svg>
                            Table
                        </button>
                        <button class="view-btn" data-view="cards">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="7" />
                                <rect x="3" y="14" width="18" height="7" />
                            </svg>
                            Cards
                        </button>
                    </div>
                </div>

                <div id="dataContainer" class="data-container">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Click "Load Dataset" to retrieve data from Firestore</p>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="pagination" style="display: none;">
                    <button class="btn btn-sm" id="prevPageBtn" disabled>Previous</button>
                    <span id="pageInfo">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextPageBtn" disabled>Next</button>
                </div>
            </section>
        </main>

        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>

        <!-- Detail Modal -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Record Details</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="dataset.js"></script>
</body>

</html>
